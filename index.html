<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two Note Lab</title><style>
body{margin:0;background:#101114;color:#eee;font:16px system-ui;padding:18px}.app{max-width:900px;margin:auto}.tag{font-size:12px;letter-spacing:.15em;color:#999}h1{font-size:38px;margin:8px 0}.panel{background:#181a1f;border:1px solid #30333b;border-radius:15px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid>div{min-width:0}.control{overflow:hidden}label{display:block;color:#aaa;font-size:12px;margin-bottom:5px}select,input,button{box-sizing:border-box;width:100%;max-width:100%;padding:12px;border-radius:9px;border:1px solid #3a3d46;background:#111318;color:#eee}button{font-weight:700}.primary{background:#eee;color:#111}.row{display:flex;gap:9px;flex-wrap:wrap}.row button{width:auto}.dirs{display:flex;gap:8px;flex-wrap:wrap}.dirs button{width:auto}.active{background:#eee;color:#111}.note.playing{background:#fff;outline:4px solid #fff;transform:translateY(-6px);filter:brightness(1.35)}.note.selected{outline:3px solid #78b7ff}.editor{display:none;margin-top:14px;padding-top:14px;border-top:1px solid #30333b}.editor.open{display:block}.editorGrid{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end}.editorGrid button{width:auto}.durLabel{font-size:10px;opacity:.7;display:block;margin-top:3px}.preview{border-color:#555}.notes{display:flex;gap:var(--note-gap,7px);align-items:end;min-height:190px;overflow:hidden;padding:15px 0;width:100%}.note{flex:1 1 0;min-width:0;max-width:70px;background:#ddd;color:#111;border-radius:8px;padding:8px 2px;text-align:center;font-size:var(--note-font,14px);transition:transform .08s,filter .08s}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:#aaa}.key{display:inline-block;width:12px;height:12px;border-radius:3px;background:#ddd;vertical-align:-2px;margin-right:5px}.key.seedKey{outline:3px solid #ffbd59}.key.rootKey{box-shadow:inset 0 -4px #777}.seed{outline:3px solid #ffbd59}.root{box-shadow:inset 0 -6px #777}.meta{font-family:monospace;color:#bbb;white-space:pre-wrap}.error{color:#ff8c8c}input[type=range]{display:block;padding:0;margin:10px 0;height:32px}.sliderGrid{grid-template-columns:1fr}.sliderGrid>div{padding:0 2px}@media(max-width:600px){.editorGrid{grid-template-columns:1fr 1fr}.editorGrid button{width:100%;grid-column:1/-1}body{padding:12px}.panel{padding:14px}.grid{grid-template-columns:1fr 1fr}.sliderGrid{grid-template-columns:1fr}h1{font-size:31px}}
</style></head><body><main class="app"><div class="tag">PROTOTYPE 0.15</div><h1>Two Note Lab</h1><p>Give it a home note and one note you want in the idea. Explicit music-theory rules; no AI.</p>
<section class="panel"><div class="grid"><div><label>HOME</label><select id="home"></select></div><div><label>SEED</label><select id="seed"></select></div><div><label>GENRE</label><select id="genre"><option>Pop</option><option>Rock</option><option>Hardcore</option><option selected>Indie / Emo</option><option>Metal</option><option>Funk / R&B</option><option>Jazz</option><option>Electronic</option><option>Other</option></select></div><div><label>OCTAVE</label><select id="octave"><option>0</option><option selected>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div><label>NOTES</label><select id="count"><option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option></select></div></div><p id="analysis" class="meta"></p></section>
<details class="panel" id="advanced"><summary><strong>Advanced / Theory</strong></summary><div style="height:14px"></div><div class="grid"><div><label>SEED ROLE</label><select id="role"><option>Auto</option><option>Anchor</option><option>Destination</option><option>Tension</option></select></div><div><label>THEORY FRAMEWORK</label><select id="framework"></select></div></div><div style="height:14px"></div><div class="grid sliderGrid"><div class="control"><label>TENSION</label><input id="tension" type="range" min="0" max="100" value="45"></div><div class="control"><label>COMPLEXITY</label><input id="complexity" type="range" min="0" max="100" value="45"></div><div class="control"><label>MOVEMENT</label><input id="movement" type="range" min="0" max="100" value="50"></div></div></details>
<section class="panel"><div class="row"><button class="primary" id="generate">Generate</button><button id="mutate">Mutate</button><button id="midi">Download MIDI</button></div><div id="notes" class="notes"></div><div class="legend"><span><i class="key seedKey"></i>Seed note</span><span><i class="key rootKey"></i>Home note</span></div><div id="editor" class="editor"><div class="editorGrid"><div><label>PITCH</label><select id="editPitch"></select></div><div><label>LENGTH</label><select id="editDur"><option value=".25">1/16</option><option value=".5" selected>1/8</option><option value="1">1/4</option><option value="2">1/2</option><option value="4">Whole</option></select></div><button id="editLock">Lock note</button></div></div><div id="status" class="meta">Starting engine…</div></section><section class="panel preview"><label>PREVIEW</label><div class="row"><button class="primary" id="play">▶ Play Melody</button></div><p class="meta">Turn Silent Mode off on iPhone for preview audio.</p></section></main>
<script>
(()=>{const N=['C','C#/Db','D','D#/Eb','E','F','F#/Gb','G','G#/Ab','A','A#/Bb','B'],I=['Unison','Minor 2nd','Major 2nd','Minor 3rd','Major 3rd','Perfect 4th','Tritone','Perfect 5th','Minor 6th','Major 6th','Minor 7th','Major 7th'];
const S={Major:[0,2,4,5,7,9,11],Minor:[0,2,3,5,7,8,10],Dorian:[0,2,3,5,7,9,10],Phrygian:[0,1,3,5,7,8,10],Lydian:[0,2,4,6,7,9,11],Mixolydian:[0,2,4,5,7,9,10],'Major Pentatonic':[0,2,4,7,9],'Minor Pentatonic':[0,3,5,7,10],Blues:[0,3,5,6,7,10]};
let scale='Major',melody=[],selected=-1,audioCtx=null,master=null;const $=id=>document.getElementById(id),pc=(x)=>((x%12)+12)%12;
function options(){N.forEach((n,i)=>{$('home').add(new Option(n,i));$('seed').add(new Option(n,i))});$('home').value=3;$('seed').value=9}
function compatible(){let d=pc(+$('seed').value-+$('home').value);return Object.keys(S).map(k=>({name:k,contains:S[k].includes(d)}))}
const GP={'Pop':['Major','Minor','Major Pentatonic','Minor Pentatonic','Mixolydian'],'Rock':['Minor Pentatonic','Mixolydian','Major','Minor','Blues'],'Hardcore':['Minor','Minor Pentatonic','Blues','Phrygian','Dorian'],'Indie / Emo':['Major','Minor','Dorian','Lydian','Mixolydian','Major Pentatonic'],'Metal':['Minor','Phrygian','Dorian','Blues','Minor Pentatonic'],'Funk / R&B':['Dorian','Mixolydian','Minor Pentatonic','Major Pentatonic','Blues'],'Jazz':['Dorian','Mixolydian','Lydian','Major','Minor'],'Electronic':['Minor','Dorian','Phrygian','Major','Minor Pentatonic'],'Other':Object.keys(S)};
function chooseTheory(){let d=pc(+$('seed').value-+$('home').value),prefs=GP[$('genre').value]||Object.keys(S),fit=prefs.filter(k=>S[k].includes(d));return (fit[0]||prefs[0]||'Major')}
function analyze(){let h=+$('home').value,s=+$('seed').value,d=pc(s-h),suggest=chooseTheory(),fw=$('framework');if(!fw.dataset.manual)scale=suggest;fw.innerHTML='';Object.keys(S).forEach(k=>fw.add(new Option(k+(S[k].includes(d)?'':' (seed chromatic)'),k)));fw.value=scale;$('analysis').textContent=N[h]+' → '+N[s]+' · '+I[d]+' · '+$('genre').value+' logic → '+scale}
function pick(prev,idx,len){let h=+$('home').value,ints=S[scale],move=+$('movement').value/100,t=+$('tension').value/100,c=+$('complexity').value/100,cands=[],home=60+pc(h),maxLeap=5+Math.round(move*5+c*2);for(let o=3;o<=5;o++)for(let x of ints){let m=12*(o+1)+pc(h+x),leap=Math.abs(m-prev),fromHome=Math.abs(m-home);if(leap>maxLeap&&Math.random()>(c*.18))continue;if(fromHome>12&&c<.7)continue;let w=12-Math.min(10,leap*.9);if(leap<=2+move*6)w+=7;if(leap<=5)w+=4;if(x===0)w+=idx===len-1?9:3;if([1,6,10,11].includes(x))w+=t*2;if(leap>7)w*=.25+c*.35;cands.push([m,Math.max(.15,w)])}if(!cands.length)return prev;let total=cands.reduce((a,x)=>a+x[1],0),r=Math.random()*total;for(let x of cands){r-=x[1];if(r<=0)return x[0]}return cands[0][0]}
function applySeed(a){let s=60+pc(+$('seed').value-0);while(s<55)s+=12;while(s>76)s-=12,role=$('role').value;if(role==='Destination')a[a.length-1]=s;else if(role==='Anchor'){a[1]=s;if(a.length>5)a[Math.floor(a.length/2)]=s}else if(role==='Tension')a[Math.max(1,a.length-2)]=s;else a[Math.floor(a.length*.65)]=s}
function transposeRegister(a){let target=+$('octave').value,delta=(target-4)*12,out=a.map(m=>Math.max(12,Math.min(119,m+delta))),center=12*(target+1)+pc(+$('home').value),lo=Math.max(12,center-7),hi=Math.min(119,center+12);return out.map((m,i)=>{while(m<lo)m+=12;while(m>hi)m-=12;if(i&&Math.abs(m-out[i-1])>12)m+=m>out[i-1]?-12:12;return Math.max(12,Math.min(119,m))})}
function rhythm(i,len,m){let r=Math.random(),home=pc(+$('home').value),seed=pc(+$('seed').value);if(i===len-1||pc(m)===home&&r<.38)return 1;if(pc(m)===seed&&r<.45)return 1;if(r<.16)return .25;if(r<.68)return .5;return 1}
function generate(){let len=+$('count').value,h=60+pc(+$('home').value),a=[h];for(let i=1;i<len;i++)a.push(pick(a[i-1],i,len));applySeed(a);a=transposeRegister(a);melody=a.map((m,i)=>({pitch:m,dur:rhythm(i,len,m),locked:false}));selected=-1;render();$('status').textContent='Ready · '+$('genre').value+' · '+scale+' · '+len+' notes'}
function mutate(){if(!melody.length)return generate();let pitches=melody.map(n=>n.pitch);for(let i=1;i<pitches.length;i++)if(!melody[i].locked&&Math.random()<.5)pitches[i]=pick(pitches[i-1],i,pitches.length);applySeed(pitches);pitches=transposeRegister(pitches);melody=melody.map((n,i)=>n.locked?n:{pitch:pitches[i],dur:Math.random()<.45?rhythm(i,pitches.length,pitches[i]):n.dur,locked:false});render();$('status').textContent='Mutation complete'}
function allowedPitches(){let root=pc(+$('home').value),seed=pc(+$('seed').value),target=+$('octave').value,pcs=new Set(S[scale].map(x=>pc(root+x)));pcs.add(root);pcs.add(seed);let center=12*(target+1)+root,out=[];for(let m=Math.max(12,center-12);m<=Math.min(119,center+19);m++)if(pcs.has(pc(m)))out.push(m);return out}
function openEditor(i){selected=i;let n=melody[i],p=$('editPitch');p.innerHTML='';allowedPitches().forEach(m=>p.add(new Option(N[pc(m)].split('/')[0]+(Math.floor(m/12)-1),m)));if(![...p.options].some(o=>+o.value===n.pitch))p.add(new Option(N[pc(n.pitch)].split('/')[0]+(Math.floor(n.pitch/12)-1),n.pitch));p.value=n.pitch;$('editDur').value=n.dur;$('editLock').textContent=n.locked?'Unlock note':'Lock note';$('editor').classList.add('open');render()}
function render(){let box=$('notes'),n=Math.max(1,melody.length),total=melody.reduce((a,x)=>a+x.dur,0);box.innerHTML='';box.style.setProperty('--note-gap',n>=14?'3px':n>=10?'4px':'7px');box.style.setProperty('--note-font',n>=14?'10px':n>=10?'11px':'14px');let h=pc(+$('home').value),s=pc(+$('seed').value),min=Math.min(...melody.map(x=>x.pitch)),max=Math.max(...melody.map(x=>x.pitch));melody.forEach((n,i)=>{let e=document.createElement('div'),height=72+(n.pitch-min)*5;e.className='note'+(pc(n.pitch)===s?' seed':'')+(pc(n.pitch)===h?' root':'')+(i===selected?' selected':'');e.style.height=Math.min(175,height)+'px';e.style.flexGrow=Math.max(.25,n.dur);e.style.flexBasis=0;e.style.maxWidth='none';e.dataset.index=i;e.innerHTML=N[pc(n.pitch)].split('/')[0]+(Math.floor(n.pitch/12)-1)+'<span class="durLabel">'+({'.25':'1/16','.5':'1/8','1':'1/4','2':'1/2','4':'Whole'}[String(n.dur)]||n.dur)+'</span>'+(n.locked?' 🔒':'');e.onclick=()=>openEditor(i);box.appendChild(e)})}
function initAudio(){let A=window.AudioContext||window.webkitAudioContext;if(!A)throw new Error('Web Audio unsupported');if(!audioCtx){audioCtx=new A({latencyHint:'interactive'});master=audioCtx.createGain();master.gain.value=.8;master.connect(audioCtx.destination)}return audioCtx}
function highlight(i,on){let e=$('notes').querySelector('[data-index="'+i+'"]');if(e)e.classList.toggle('playing',on)}
async function play(){try{if(!melody.length)generate();let ctx=initAudio();if(ctx.state!=='running')await ctx.resume();let now=ctx.currentTime+.08,cursor=now,beat=.58;melody.forEach((n,i)=>{let dur=Math.max(.12,n.dur*beat),start=cursor,f=440*Math.pow(2,(n.pitch-69)/12),g=ctx.createGain(),filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1800;g.gain.setValueAtTime(.001,start);g.gain.linearRampToValueAtTime(.24,start+.025);g.gain.setValueAtTime(.24,start+dur*.72);g.gain.exponentialRampToValueAtTime(.001,start+dur*.94);filter.connect(g);g.connect(master);[[1,.75],[2,.28],[3,.14]].forEach(([mult,level])=>{let o=ctx.createOscillator(),og=ctx.createGain();o.type=mult===1?'triangle':'sine';o.frequency.value=f*mult;og.gain.value=level;o.connect(og);og.connect(filter);o.start(start);o.stop(start+dur)});let delay=Math.max(0,(start-ctx.currentTime)*1000);setTimeout(()=>highlight(i,true),delay);setTimeout(()=>highlight(i,false),delay+dur*.94*1000);cursor+=dur});$('status').textContent='Playing '+melody.length+' notes'}catch(e){$('status').textContent='AUDIO ERROR: '+(e.message||e);$('status').className='meta error'}}
function vlq(v){let b=[v&127];while(v>>=7)b.unshift((v&127)|128);return b}function midi(){if(!melody.length)generate();let bytes=[77,84,104,100,0,0,0,6,0,0,0,1,0,96],trk=[0,255,81,3,7,161,32];melody.forEach(n=>{let ticks=Math.max(12,Math.round(n.dur*96));trk.push(0,144,n.pitch,96,...vlq(ticks),128,n.pitch,0)});trk.push(0,255,47,0);let n=trk.length;bytes.push(77,84,114,107,(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255,...trk);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([new Uint8Array(bytes)],{type:'audio/midi'}));a.download='two-note-lab.mid';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='MIDI downloaded'}
function bind(){['home','seed','genre','octave'].forEach(id=>$(id).onchange=()=>{$('framework').dataset.manual='';analyze();generate()});$('framework').onchange=()=>{scale=$('framework').value;$('framework').dataset.manual='1';analyze();generate()};$('role').onchange=generate;$('count').onchange=generate;$('editPitch').onchange=()=>{if(selected>=0){melody[selected].pitch=+$('editPitch').value;render()}};$('editDur').onchange=()=>{if(selected>=0){melody[selected].dur=+$('editDur').value;render()}};$('editLock').onclick=()=>{if(selected>=0){melody[selected].locked=!melody[selected].locked;openEditor(selected)}};$('generate').onclick=generate;$('mutate').onclick=mutate;$('play').onclick=play;$('midi').onclick=midi}
window.onerror=(m,s,l)=>{$('status').textContent='STARTUP ERROR: '+m+' line '+l;$('status').className='meta error'};
try{options();bind();analyze();generate()}catch(e){$('status').textContent='STARTUP ERROR: '+e.message;$('status').className='meta error'}
})();
</script></body></html>
