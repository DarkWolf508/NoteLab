<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two Note Lab</title><style>
body{margin:0;background:#101114;color:#eee;font:16px system-ui;padding:18px}.app{max-width:900px;margin:auto}.tag{font-size:12px;letter-spacing:.15em;color:#999}h1{font-size:38px;margin:8px 0}.panel{background:#181a1f;border:1px solid #30333b;border-radius:15px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid>div{min-width:0}.control{overflow:hidden}label{display:block;color:#aaa;font-size:12px;margin-bottom:5px}select,input,button{box-sizing:border-box;width:100%;max-width:100%;padding:12px;border-radius:9px;border:1px solid #3a3d46;background:#111318;color:#eee}button{font-weight:700}.primary{background:#eee;color:#111}.row{display:flex;gap:9px;flex-wrap:wrap}.row button{width:auto}.dirs{display:flex;gap:8px;flex-wrap:wrap}.dirs button{width:auto}.active{background:#eee;color:#111}.note.playing{background:#fff;outline:4px solid #fff;transform:translateY(-6px);filter:brightness(1.35)}.note.selected{outline:3px solid #78b7ff}.editor{display:none;margin-top:14px;padding-top:14px;border-top:1px solid #30333b}.editor.open{display:block}.editorGrid{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end}.editorGrid button{width:auto}.durLabel{font-size:10px;opacity:.7;display:block;margin-top:3px}.preview{border-color:#555}.notes{display:flex;gap:var(--note-gap,7px);align-items:end;min-height:190px;overflow:hidden;padding:15px 0;width:100%}.note{flex:1 1 0;min-width:0;max-width:70px;background:#ddd;color:#111;border-radius:8px;padding:8px 2px;text-align:center;font-size:var(--note-font,14px);transition:transform .08s,filter .08s}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:#aaa}.key{display:inline-block;width:12px;height:12px;border-radius:3px;background:#ddd;vertical-align:-2px;margin-right:5px}.key.seedKey{outline:3px solid #ffbd59}.key.rootKey{box-shadow:inset 0 -4px #777}.seed{outline:3px solid #ffbd59}.root{box-shadow:inset 0 -6px #777}.meta{font-family:monospace;color:#bbb;white-space:pre-wrap}.error{color:#ff8c8c}input[type=range]{display:block;padding:0;margin:10px 0;height:32px}.sliderGrid{grid-template-columns:1fr}.sliderGrid>div{padding:0 2px}@media(max-width:600px){.editorGrid{grid-template-columns:1fr 1fr}.editorGrid button{width:100%;grid-column:1/-1}body{padding:12px}.panel{padding:14px}.grid{grid-template-columns:1fr 1fr}.sliderGrid{grid-template-columns:1fr}h1{font-size:31px}}
</style></head><body><main class="app"><div class="tag">PROTOTYPE 0.23</div><h1>Two Note Lab</h1><p>Give it a home note and one note you want in the idea. Explicit music-theory rules; no AI.</p>
<section class="panel"><div class="grid"><div><label>HOME</label><select id="home"></select></div><div><label>SEED</label><select id="seed"></select></div><div><label>GENRE</label><select id="genre"><option>Pop</option><option>Rock</option><option>Hardcore</option><option selected>Indie / Emo</option><option>Metal</option><option>Funk / R&B</option><option>Jazz</option><option>Electronic</option><option>Other</option></select></div><div><label>OCTAVE</label><select id="octave"><option selected>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div><label>BARS</label><select id="bars"><option selected>1</option><option>2</option><option>3</option><option>4</option><option>8</option></select></div><div><label>TIME SIGNATURE</label><select id="meter"><option selected value="4/4">4/4</option><option value="3/4">3/4</option><option value="6/8">6/8</option><option value="5/4">5/4</option><option value="7/8">7/8</option></select></div><div><label>NOTES</label><select id="count"><option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option></select></div></div><p id="analysis" class="meta"></p></section>
<details class="panel" id="advanced"><summary><strong>Advanced / Theory</strong></summary><div style="height:14px"></div><div class="grid"><div><label>SEED ROLE</label><select id="role"><option>Auto</option><option>Anchor</option><option>Destination</option><option>Tension</option></select></div><div><label>THEORY FRAMEWORK</label><select id="framework"></select></div></div><div style="height:14px"></div><div class="grid sliderGrid"><div class="control"><label>TENSION</label><input id="tension" type="range" min="0" max="100" value="45"></div><div class="control"><label>COMPLEXITY</label><input id="complexity" type="range" min="0" max="100" value="45"></div><div class="control"><label>MOVEMENT</label><input id="movement" type="range" min="0" max="100" value="50"></div></div></details>
<section class="panel"><div class="row"><button class="primary" id="generate">Generate</button><button id="mutate">Mutate</button><button id="midi">Download MIDI</button></div><div id="notes" class="notes"></div><div class="legend"><span><i class="key seedKey"></i>Seed note</span><span><i class="key rootKey"></i>Home note</span></div><div id="editor" class="editor"><div class="editorGrid"><div><label>PITCH</label><select id="editPitch"></select></div><div><label>LENGTH</label><select id="editDur"><option value=".25">1/16</option><option value=".5" selected>1/8</option><option value="1">1/4</option><option value="2">1/2</option><option value="4">Whole</option></select></div><button id="editLock">Lock note</button></div></div><div id="status" class="meta">Starting engine…</div></section><section class="panel preview"><label>PREVIEW</label><div class="row"><button class="primary" id="play">▶ Play Melody</button></div><p class="meta">Turn Silent Mode off on iPhone for preview audio.</p></section></main>
<script>
(()=>{const N=['C','C#/Db','D','D#/Eb','E','F','F#/Gb','G','G#/Ab','A','A#/Bb','B'],I=['Unison','Minor 2nd','Major 2nd','Minor 3rd','Major 3rd','Perfect 4th','Tritone','Perfect 5th','Minor 6th','Major 6th','Minor 7th','Major 7th'];
const S={Major:[0,2,4,5,7,9,11],Minor:[0,2,3,5,7,8,10],Dorian:[0,2,3,5,7,9,10],Phrygian:[0,1,3,5,7,8,10],Lydian:[0,2,4,6,7,9,11],Mixolydian:[0,2,4,5,7,9,10],'Major Pentatonic':[0,2,4,7,9],'Minor Pentatonic':[0,3,5,7,10],Blues:[0,3,5,6,7,10]};
const GP={
'Pop':{scales:['Major','Minor','Major Pentatonic','Minor Pentatonic','Mixolydian'],repeat:.45,turn:.35,sync:.2,leap:.3,resolve:.85},
'Rock':{scales:['Minor Pentatonic','Mixolydian','Major','Minor','Blues'],repeat:.55,turn:.28,sync:.3,leap:.5,resolve:.72},
'Hardcore':{scales:['Minor','Minor Pentatonic','Blues','Phrygian','Dorian'],repeat:.72,turn:.22,sync:.42,leap:.62,resolve:.62},
'Indie / Emo':{scales:['Major','Minor','Dorian','Lydian','Mixolydian','Major Pentatonic'],repeat:.42,turn:.55,sync:.4,leap:.46,resolve:.68},
'Metal':{scales:['Minor','Phrygian','Dorian','Blues','Minor Pentatonic'],repeat:.6,turn:.32,sync:.46,leap:.7,resolve:.55},
'Funk / R&B':{scales:['Dorian','Mixolydian','Minor Pentatonic','Major Pentatonic','Blues'],repeat:.48,turn:.5,sync:.75,leap:.35,resolve:.62},
'Jazz':{scales:['Dorian','Mixolydian','Lydian','Major','Minor'],repeat:.2,turn:.72,sync:.62,leap:.58,resolve:.48},
'Electronic':{scales:['Minor','Dorian','Phrygian','Major','Minor Pentatonic'],repeat:.72,turn:.28,sync:.58,leap:.38,resolve:.58},
'Other':{scales:Object.keys(S),repeat:.4,turn:.45,sync:.4,leap:.45,resolve:.65}};
const ARCH=[
{name:'Arc',shape:[0,.35,.7,.45,.15,0]},
{name:'Rise',shape:[0,.15,.35,.55,.75,1]},
{name:'Fall',shape:[.8,.65,.5,.3,.15,0]},
{name:'Wave',shape:[0,.45,.15,.7,.35,.1]},
{name:'Question',shape:[0,.25,.1,.45,.3,.65]}
];
let scale='Major',melody=[],selected=-1,audioCtx=null,master=null,lastOctave=1,lastPlan=null,previewNodes=[],previewTimers=[];
const $=id=>document.getElementById(id),pc=x=>((x%12)+12)%12,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function options(){N.forEach((n,i)=>{$('home').add(new Option(n,i));$('seed').add(new Option(n,i))});$('home').value=3;$('seed').value=9}
function profile(){return GP[$('genre').value]||GP.Other}
function chooseTheory(){let d=pc(+$('seed').value-+$('home').value),p=profile().scales,fit=p.filter(k=>S[k].includes(d));return fit[0]||p[0]||'Major'}
function seedRole(){let chosen=$('role').value;if(chosen!=='Auto')return chosen;let d=pc(+$('seed').value-+$('home').value);if([1,6,11].includes(d))return'Tension';if([0,3,4,7].includes(d))return'Anchor';if([5,8,9].includes(d))return'Destination';return +$('tension').value>60?'Tension':'Destination'}
function analyze(){let h=+$('home').value,s=+$('seed').value,d=pc(s-h),suggest=chooseTheory(),fw=$('framework');if(!fw.dataset.manual)scale=suggest;fw.innerHTML='';Object.keys(S).forEach(k=>fw.add(new Option(k+(S[k].includes(d)?'':' (seed chromatic)'),k)));fw.value=scale;$('analysis').textContent=N[h]+' → '+N[s]+' · '+I[d]+' · '+$('genre').value+' → '+scale+' · Seed: '+seedRole()}
function homeMidi(){let o=+$('octave').value,h=+$('home').value;return 12*(o+1)+h}
function scalePCs(){let h=+$('home').value;return new Set(S[scale].map(x=>pc(h+x)))}
function nearestPC(target,pitchClass,lo,hi){let best=null,dist=1e9;for(let m=lo;m<=hi;m++)if(pc(m)===pitchClass&&Math.abs(m-target)<dist){best=m;dist=Math.abs(m-target)}return best??clamp(target,lo,hi)}
function contour(len){let a=ARCH[Math.floor(Math.random()*ARCH.length)],move=+$('movement').value/100,span=3+Math.round(move*9),vals=[];for(let i=0;i<len;i++){let x=i*(a.shape.length-1)/Math.max(1,len-1),j=Math.floor(x),q=x-j,v=a.shape[j]*(1-q)+a.shape[Math.min(a.shape.length-1,j+1)]*q;vals.push((v-.35)*span)}return{name:a.name,vals}}
function meterInfo(){let [num,den]=$('meter').value.split('/').map(Number),bars=+$('bars').value,beat=4/den;return{num,den,bars,barBeats:num*beat,total:num*beat*bars}}
function rhythmPlan(len){let m=meterInfo(),p=profile(),c=+$('complexity').value/100,total=m.total,grid=m.den===8?.5:.25,min=.25,out=[],remaining=total;for(let i=0;i<len;i++){let left=len-i,avg=remaining/left,choices=[.25,.5,.75,1,1.5,2,3,4].filter(x=>x<=remaining-min*(left-1)+1e-6);if(!choices.length){out.push(Math.max(min,remaining));remaining=0;continue}let target=avg;if(p.sync>.6&&i%2===1)target*=.72;if(c<.35)target=Math.round(target/.5)*.5||.5;let weights=choices.map(x=>{let w=8/(1+Math.abs(x-target)*5);if(m.den===8&&x%0.5===0)w*=1.5;if(m.den===4&&x%0.5===0)w*=1.25;if(x===.75||x===1.5)w*=.65+p.sync*.9;return[x,w]}),d=weighted(weights);out.push(d);remaining-=d}if(Math.abs(remaining)>.001)out[out.length-1]+=remaining;return out}
function seedIndex(len,role){if(role==='Destination')return len-1;if(role==='Tension')return Math.max(1,len-2);if(role==='Anchor')return Math.max(1,Math.floor(len/2));return Math.floor(len*.65)}
function candidates(prev,target,history,idx,len){let root=homeMidi(),pcs=scalePCs(),move=+$('movement').value/100,c=+$('complexity').value/100,t=+$('tension').value/100,p=profile(),maxLeap=2+Math.round(move*10),lo=Math.max(12,root-12),hi=Math.min(119,root+16),out=[];for(let m=lo;m<=hi;m++){if(!pcs.has(pc(m)))continue;let leap=Math.abs(m-prev);if(leap>maxLeap)continue;let w=12/(1+Math.abs(m-target));if(leap===0)w*=p.repeat*(1.7-c)+.15;if(leap>=5)w*=.5+p.leap+move;if(history.includes(m))w*=.55+c*.75;let dir=history.length>1?Math.sign(prev-history[history.length-2]):0,newDir=Math.sign(m-prev);if(dir&&newDir&&dir!==newDir)w*=.55+p.turn+c*.55;if(idx===len-1&&pc(m)===pc(root))w*=1+p.resolve*2;if([1,6,11].includes(pc(m-root)))w*=.7+t*.9;out.push([m,Math.max(.05,w)])}return out}
function weighted(c){if(!c.length)return null;let total=c.reduce((a,x)=>a+x[1],0),r=Math.random()*total;for(let x of c){r-=x[1];if(r<=0)return x[0]}return c[0][0]}
function makeCandidate(len){let root=homeMidi(),role=seedRole(),ct=contour(len),rh=rhythmPlan(len),seedI=seedIndex(len,role),seedPC=+$('seed').value,pitches=[root],lo=Math.max(12,root-12),hi=Math.min(119,root+16);for(let i=1;i<len;i++){let target=root+ct.vals[i],m=weighted(candidates(pitches[i-1],target,pitches,i,len));pitches.push(m??pitches[i-1])}let seedTarget=nearestPC(pitches[Math.max(0,seedI-1)],seedPC,lo,hi);pitches[seedI]=seedTarget;if(role==='Anchor'&&len>6){let j=Math.max(1,Math.floor(len*.25));pitches[j]=nearestPC(pitches[j-1],seedPC,lo,hi)}if(role==='Tension'&&seedI<len-1){let resTarget=root,pool=candidates(pitches[seedI],resTarget,pitches.slice(0,seedI+1),seedI+1,len);pitches[seedI+1]=weighted(pool)??nearestPC(root,pc(root),lo,hi)}return{notes:pitches.map((pitch,i)=>({pitch,dur:rh[i],locked:false})),plan:ct.name,role}}
function scoreCandidate(x){let a=x.notes,root=homeMidi(),seed=+$('seed').value,c=+$('complexity').value/100,score=100,seen=new Set(),dirs=[];for(let i=0;i<a.length;i++){seen.add(a[i].pitch);if(i){let leap=Math.abs(a[i].pitch-a[i-1].pitch);if(leap>12)score-=20;if(leap>7)score-=5;dirs.push(Math.sign(a[i].pitch-a[i-1].pitch))}}let seedHits=a.filter(n=>pc(n.pitch)===seed).length;if(!seedHits)score-=40;if(seen.size===1)score-=35;if(c>.55&&seen.size<Math.ceil(a.length*.45))score-=12;if(c<.35&&seen.size>a.length*.85)score-=8;if(x.role==='Destination'&&pc(a[a.length-1].pitch)!==seed)score-=20;if(x.role==='Tension'){let i=seedIndex(a.length,x.role);if(i<a.length-1&&Math.abs(a[i+1].pitch-root)>7)score-=8}score-=Math.max(0,Math.max(...a.map(n=>n.pitch))-Math.min(...a.map(n=>n.pitch))-16)*2;return score+Math.random()*3}
function generate(){let len=+$('count').value,best=null,bestScore=-1e9;for(let k=0;k<18;k++){let x=makeCandidate(len),s=scoreCandidate(x);if(s>bestScore){best=x;bestScore=s}}melody=best.notes;lastPlan=best;selected=-1;render();$('editor').classList.remove('open');$('status').textContent='Ready · '+$('bars').value+' bar'+(+$('bars').value===1?'':'s')+' · '+$('meter').value+' · '+$('genre').value+' · '+scale+' · '+best.plan+' · '+best.role+' seed'}
function transposeExisting(delta){if(!melody.length)return generate();melody=melody.map(n=>({...n,pitch:clamp(n.pitch+delta,12,119)}));selected=-1;render();$('editor').classList.remove('open');$('status').textContent='Phrase transposed '+(delta>0?'up':'down')+' one octave'}
function mutate(){stopPreview();if(!melody.length)return generate();let original=melody.map(n=>({...n})),len=melody.length,best=null,bestScore=-1e9;for(let k=0;k<14;k++){let fresh=makeCandidate(len),notes=fresh.notes.map((n,i)=>original[i].locked?original[i]:(Math.random()<.55?n:{...original[i],dur:Math.random()<.35?n.dur:original[i].dur})),x={notes,plan:fresh.plan,role:fresh.role},s=scoreCandidate(x);if(s>bestScore){best=x;bestScore=s}}melody=best.notes;lastPlan=best;render();$('status').textContent='Mutation complete · locked notes preserved'}
function allowedPitches(){let root=homeMidi(),seed=pc(+$('seed').value),pcs=scalePCs();pcs.add(pc(root));pcs.add(seed);let out=[];for(let m=Math.max(12,root-12);m<=Math.min(119,root+19);m++)if(pcs.has(pc(m)))out.push(m);return out}
function openEditor(i){selected=i;let n=melody[i],p=$('editPitch');p.innerHTML='';allowedPitches().forEach(m=>p.add(new Option(N[pc(m)].split('/')[0]+(Math.floor(m/12)-1),m)));if(![...p.options].some(o=>+o.value===n.pitch))p.add(new Option(N[pc(n.pitch)].split('/')[0]+(Math.floor(n.pitch/12)-1),n.pitch));p.value=n.pitch;$('editDur').value=n.dur;$('editLock').textContent=n.locked?'Unlock note':'Lock note';$('editor').classList.add('open');render()}
function render(){let box=$('notes'),n=Math.max(1,melody.length);box.innerHTML='';box.style.setProperty('--note-gap',n>=14?'3px':n>=10?'4px':'7px');box.style.setProperty('--note-font',n>=14?'10px':n>=10?'11px':'14px');let h=pc(+$('home').value),s=pc(+$('seed').value),min=melody.length?Math.min(...melody.map(x=>x.pitch)):0;melody.forEach((n,i)=>{let e=document.createElement('div'),height=72+(n.pitch-min)*5;e.className='note'+(pc(n.pitch)===s?' seed':'')+(pc(n.pitch)===h?' root':'')+(i===selected?' selected':'');e.style.height=Math.min(175,height)+'px';e.style.flexGrow=Math.max(.25,n.dur);e.style.flexBasis=0;e.style.maxWidth='none';e.dataset.index=i;e.innerHTML=N[pc(n.pitch)].split('/')[0]+(Math.floor(n.pitch/12)-1)+'<span class="durLabel">'+({'.25':'1/16','.5':'1/8','1':'1/4','2':'1/2','4':'Whole'}[String(n.dur)]||n.dur)+'</span>'+(n.locked?' 🔒':'');e.onclick=()=>openEditor(i);box.appendChild(e)})}
function initAudio(){let A=window.AudioContext||window.webkitAudioContext;if(!A)throw new Error('Web Audio unsupported');if(!audioCtx){audioCtx=new A({latencyHint:'interactive'});master=audioCtx.createGain();master.gain.value=.8;master.connect(audioCtx.destination)}return audioCtx}
function highlight(i,on){let e=$('notes').querySelector('[data-index="'+i+'"]');if(e)e.classList.toggle('playing',on)}
function stopPreview(){previewTimers.forEach(clearTimeout);previewTimers=[];previewNodes.forEach(o=>{try{o.stop()}catch(e){}});previewNodes=[];$('notes').querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'))}
async function play(){try{stopPreview();if(!melody.length)generate();let ctx=initAudio();if(ctx.state!=='running')await ctx.resume();let cursor=ctx.currentTime+.08,beat=.58;melody.forEach((n,i)=>{let dur=Math.max(.12,n.dur*beat),start=cursor,f=440*Math.pow(2,(n.pitch-69)/12),g=ctx.createGain(),filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1800;g.gain.setValueAtTime(.001,start);g.gain.linearRampToValueAtTime(.24,start+.025);g.gain.setValueAtTime(.24,start+dur*.72);g.gain.exponentialRampToValueAtTime(.001,start+dur*.94);filter.connect(g);g.connect(master);[[1,.75],[2,.28],[3,.14]].forEach(([mult,level])=>{let o=ctx.createOscillator(),og=ctx.createGain();o.type=mult===1?'triangle':'sine';o.frequency.value=f*mult;og.gain.value=level;o.connect(og);og.connect(filter);o.start(start);o.stop(start+dur);previewNodes.push(o)});let delay=Math.max(0,(start-ctx.currentTime)*1000);previewTimers.push(setTimeout(()=>highlight(i,true),delay));previewTimers.push(setTimeout(()=>highlight(i,false),delay+dur*.94*1000));cursor+=dur});$('status').textContent='Playing '+melody.length+' notes'}catch(e){$('status').textContent='AUDIO ERROR: '+(e.message||e);$('status').className='meta error'}}
function vlq(v){let b=[v&127];while(v>>=7)b.unshift((v&127)|128);return b}
function midi(){if(!melody.length)generate();let bytes=[77,84,104,100,0,0,0,6,0,0,0,1,0,96],trk=[0,255,81,3,7,161,32];melody.forEach(n=>{let ticks=Math.max(12,Math.round(n.dur*96));trk.push(0,144,n.pitch,96,...vlq(ticks),128,n.pitch,0)});trk.push(0,255,47,0);let n=trk.length;bytes.push(77,84,114,107,(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255,...trk);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([new Uint8Array(bytes)],{type:'audio/midi'}));a.download='two-note-lab.mid';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='MIDI downloaded'}
function bind(){['home','seed','genre'].forEach(id=>$(id).onchange=()=>{$('framework').dataset.manual='';analyze();generate()});$('octave').onchange=()=>{let o=+$('octave').value,d=(o-lastOctave)*12;lastOctave=o;transposeExisting(d)};$('framework').onchange=()=>{scale=$('framework').value;$('framework').dataset.manual='1';analyze();generate()};$('role').onchange=()=>{analyze();generate()};$('count').onchange=generate;$('bars').onchange=generate;$('meter').onchange=generate;['movement','complexity','tension'].forEach(id=>$(id).onchange=()=>{analyze();generate()});$('editPitch').onchange=()=>{if(selected>=0){melody[selected].pitch=+$('editPitch').value;render()}};$('editDur').onchange=()=>{if(selected>=0){melody[selected].dur=+$('editDur').value;render()}};$('editLock').onclick=()=>{if(selected>=0){melody[selected].locked=!melody[selected].locked;openEditor(selected)}};$('generate').onclick=generate;$('mutate').onclick=mutate;$('play').onclick=play;$('midi').onclick=midi}
window.onerror=(m,s,l)=>{$('status').textContent='STARTUP ERROR: '+m+' line '+l;$('status').className='meta error'};
try{options();lastOctave=+$('octave').value;bind();analyze();generate()}catch(e){$('status').textContent='STARTUP ERROR: '+e.message;$('status').className='meta error'}
})();
</script></body></html>
