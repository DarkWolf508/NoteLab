<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two Note Lab</title><style>
body{margin:0;background:#101114;color:#eee;font:16px system-ui;padding:18px}.app{max-width:900px;margin:auto}.tag{font-size:12px;letter-spacing:.15em;color:#999}h1{font-size:38px;margin:8px 0}.panel{background:#181a1f;border:1px solid #30333b;border-radius:15px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid>div{min-width:0}.control{overflow:hidden}label{display:block;color:#aaa;font-size:12px;margin-bottom:5px}select,input,button{box-sizing:border-box;width:100%;max-width:100%;padding:12px;border-radius:9px;border:1px solid #3a3d46;background:#111318;color:#eee}button{font-weight:700}.primary{background:#eee;color:#111}.row{display:flex;gap:9px;flex-wrap:wrap}.row button{width:auto}.dirs{display:flex;gap:8px;flex-wrap:wrap}.dirs button{width:auto}.active{background:#eee;color:#111}.notes{display:flex;gap:7px;align-items:end;min-height:190px;overflow:auto;padding:15px 0}.note{min-width:44px;background:#ddd;color:#111;border-radius:8px;padding:8px 3px;text-align:center}.seed{outline:3px solid #ffbd59}.root{box-shadow:inset 0 -6px #777}.meta{font-family:monospace;color:#bbb;white-space:pre-wrap}.error{color:#ff8c8c}input[type=range]{display:block;padding:0;margin:10px 0;height:32px}.sliderGrid{grid-template-columns:1fr}.sliderGrid>div{padding:0 2px}@media(max-width:600px){body{padding:12px}.panel{padding:14px}.grid{grid-template-columns:1fr 1fr}.sliderGrid{grid-template-columns:1fr}h1{font-size:31px}}
</style></head><body><main class="app"><div class="tag">THEORY PROTOTYPE 0.6</div><h1>Two Note Lab</h1><p>Give it a home note and one note you want in the idea. Explicit music-theory rules; no AI.</p>
<section class="panel"><div class="grid"><div><label>HOME</label><select id="home"></select></div><div><label>SEED</label><select id="seed"></select></div><div><label>SEED ROLE</label><select id="role"><option>Auto</option><option>Anchor</option><option>Destination</option><option>Tension</option></select></div><div><label>NOTES</label><select id="count"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option selected>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option></select></div></div><p id="analysis" class="meta"></p><div id="dirs" class="dirs"></div></section>
<section class="panel"><div class="grid sliderGrid"><div class="control"><label>TENSION</label><input id="tension" type="range" min="0" max="100" value="45"></div><div class="control"><label>COMPLEXITY</label><input id="complexity" type="range" min="0" max="100" value="45"></div><div class="control"><label>MOVEMENT</label><input id="movement" type="range" min="0" max="100" value="50"></div></div></section>
<section class="panel"><div class="row"><button class="primary" id="generate">Generate</button><button id="mutate">Mutate</button><button id="play">Play</button><button id="midi">Download MIDI</button></div><div id="notes" class="notes"></div><div id="status" class="meta">Starting engine…</div></section></main>
<script>
(()=>{const N=['C','C#/Db','D','D#/Eb','E','F','F#/Gb','G','G#/Ab','A','A#/Bb','B'],I=['Unison','Minor 2nd','Major 2nd','Minor 3rd','Major 3rd','Perfect 4th','Tritone','Perfect 5th','Minor 6th','Major 6th','Minor 7th','Major 7th'];
const S={Major:[0,2,4,5,7,9,11],Minor:[0,2,3,5,7,8,10],Dorian:[0,2,3,5,7,9,10],Phrygian:[0,1,3,5,7,8,10],Lydian:[0,2,4,6,7,9,11],Mixolydian:[0,2,4,5,7,9,10],'Major Pentatonic':[0,2,4,7,9],'Minor Pentatonic':[0,3,5,7,10],Blues:[0,3,5,6,7,10]};
let scale='Major',melody=[],locks=[],audioCtx=null,master=null;const $=id=>document.getElementById(id),pc=(x)=>((x%12)+12)%12;
function options(){N.forEach((n,i)=>{$('home').add(new Option(n,i));$('seed').add(new Option(n,i))});$('home').value=2;$('seed').value=11}
function compatible(){let d=pc(+$('seed').value-+$('home').value);return Object.keys(S).map(k=>({name:k,contains:S[k].includes(d)}))}
function analyze(){let h=+$('home').value,s=+$('seed').value,d=pc(s-h),a=compatible(),inside=a.filter(x=>x.contains);if(!a.some(x=>x.name===scale&&x.contains)&&inside.length)scale=inside[0].name;$('analysis').textContent=N[h]+' → '+N[s]+' · '+I[d]+' · '+d+' semitone'+(d===1?'':'s')+' · solid = seed is diatonic';$('dirs').innerHTML='';a.forEach(x=>{let b=document.createElement('button');b.textContent=x.name+(x.contains?'':' · chromatic');b.style.opacity=x.contains?'1':'.55';b.className=x.name===scale?'active':'';b.onclick=()=>{scale=x.name;analyze();generate()};$('dirs').appendChild(b)})}
function pick(prev,idx,len){let h=+$('home').value,ints=S[scale],move=+$('movement').value/100,t=+$('tension').value/100,c=+$('complexity').value/100,cands=[];for(let o=3;o<=5;o++)for(let x of ints){let m=12*(o+1)+pc(h+x);let leap=Math.abs(m-prev),w=8-Math.min(7,leap*.45);if(leap<=2+move*10)w+=5;if(x===0)w+=idx===len-1?7:2;if([1,6,10,11].includes(x))w+=t*3;if(leap>7)w+=c*3;cands.push([m,Math.max(.2,w)])}let total=cands.reduce((a,x)=>a+x[1],0),r=Math.random()*total;for(let x of cands){r-=x[1];if(r<=0)return x[0]}return cands[0][0]}
function applySeed(a){let s=60+pc(+$('seed').value-0);while(s<55)s+=12;while(s>76)s-=12,role=$('role').value;if(role==='Destination')a[a.length-1]=s;else if(role==='Anchor'){a[1]=s;if(a.length>5)a[Math.floor(a.length/2)]=s}else if(role==='Tension')a[Math.max(1,a.length-2)]=s;else a[Math.floor(a.length*.65)]=s}
function generate(){let len=+$('count').value,h=60+pc(+$('home').value),a=[h];for(let i=1;i<len;i++)a.push(pick(a[i-1],i,len));applySeed(a);melody=a;locks=a.map(()=>false);render();$('status').textContent='Engine ready · '+scale+' · generated '+len+' notes'}
function mutate(){if(!melody.length)return generate();let a=[...melody];for(let i=1;i<a.length;i++)if(!locks[i]&&Math.random()<.5)a[i]=pick(a[i-1],i,a.length);applySeed(a);melody=a;render();$('status').textContent='Mutation complete'}
function render(){$('notes').innerHTML='';let h=pc(+$('home').value),s=pc(+$('seed').value);melody.forEach((m,i)=>{let e=document.createElement('div');e.className='note'+(pc(m)===s?' seed':'')+(pc(m)===h?' root':'');e.style.height=(70+(m-48)*3)+'px';e.textContent=N[pc(m)].split('/')[0]+(Math.floor(m/12)-1)+(locks[i]?' 🔒':'');e.onclick=()=>{locks[i]=!locks[i];render()};$('notes').appendChild(e)})}
function initAudio(){let A=window.AudioContext||window.webkitAudioContext;if(!A)throw new Error('Web Audio unsupported');if(!audioCtx){audioCtx=new A({latencyHint:'interactive'});master=audioCtx.createGain();master.gain.value=.8;master.connect(audioCtx.destination)}return audioCtx}
async function play(){try{if(!melody.length)generate();let ctx=initAudio();if(ctx.state!=='running')await ctx.resume();if(ctx.state!=='running')throw new Error('AudioContext state is '+ctx.state);let now=ctx.currentTime+.08;melody.forEach((m,i)=>{let start=now+i*.34,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.001,start);g.gain.linearRampToValueAtTime(.32,start+.025);g.gain.exponentialRampToValueAtTime(.001,start+.30);o.connect(g);g.connect(master);o.start(start);o.stop(start+.31)});$('status').className='meta';$('status').textContent='Playing '+melody.length+' notes · audio '+ctx.state+' · '+Math.round(ctx.sampleRate)+' Hz'}catch(e){$('status').textContent='AUDIO ERROR: '+(e&&e.message?e.message:e)+' · '+navigator.userAgent;$('status').className='meta error'}}
function midi(){if(!melody.length)generate();let bytes=[77,84,104,100,0,0,0,6,0,0,0,1,0,96],trk=[0,255,81,3,7,161,32];melody.forEach(m=>{trk.push(0,144,m,96,96,128,m,0)});trk.push(0,255,47,0);let n=trk.length;bytes.push(77,84,114,107,(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255,...trk);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([new Uint8Array(bytes)],{type:'audio/midi'}));a.download='two-note-lab.mid';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='MIDI downloaded'}
function bind(){['home','seed'].forEach(id=>$(id).onchange=()=>{analyze();generate()});$('role').onchange=generate;$('count').onchange=generate;$('generate').onclick=generate;$('mutate').onclick=mutate;$('play').onclick=play;$('midi').onclick=midi}
window.onerror=(m,s,l)=>{$('status').textContent='STARTUP ERROR: '+m+' line '+l;$('status').className='meta error'};
try{options();bind();analyze();generate()}catch(e){$('status').textContent='STARTUP ERROR: '+e.message;$('status').className='meta error'}
})();
</script></body></html>
